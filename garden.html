<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-кезең — Гүлзар</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:linear-gradient(145deg,#e5f9ff,#fff2f7,#e1ffd9);color:#17396c}.wrap{max-width:1450px;margin:auto;padding:12px}header{background:linear-gradient(90deg,#ff8b20,#f5487d);border-radius:22px;color:white;text-align:center;padding:14px;font-weight:bold;font-size:clamp(28px,3.4vw,48px);text-shadow:1px 2px #9b3542}.nav{text-align:center;margin:12px}.pill{display:inline-block;background:#1262dd;color:white;padding:10px 25px;border-radius:20px;font-size:26px;font-weight:bold}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:14px}.panel{background:#fffdf8;border:4px solid #e9b04a;border-radius:24px;padding:18px;box-shadow:0 6px 18px #7773}.garden{border-color:#45a9d9;background:linear-gradient(#e4faff,#f1ffe4)}.flowers{display:flex;justify-content:space-around;gap:12px}.flower{flex:1;text-align:center;min-width:0}.flower img{width:100%;height:260px;object-fit:contain;mix-blend-mode:multiply}.count{font-size:clamp(25px,2.5vw,38px);font-weight:bold;color:#a7224b}.hint{font-size:clamp(21px,2vw,28px);font-weight:bold;text-align:center;margin:12px}.brace{position:relative;margin:5px 7% 15px;height:43px;border-bottom:6px solid #1452bd;border-radius:0 0 48% 48%}.brace:before,.brace:after{content:'';position:absolute;bottom:-5px;width:20px;height:22px;border-bottom:6px solid #1452bd}.brace:before{left:-5px;border-left:6px solid #1452bd;border-radius:0 0 0 20px}.brace:after{right:-5px;border-right:6px solid #1452bd;border-radius:0 0 20px 0}.question{text-align:center;font-size:35px;font-weight:bold;color:#d52643}.story{font-size:clamp(24px,2.4vw,34px);font-weight:bold;line-height:1.4}.tag{color:#c34c19;font-size:clamp(28px,2.7vw,40px);margin:0 0 12px}.questionLabel{font-size:clamp(23px,2.2vw,31px);font-weight:bold;color:#174b92;margin:14px 0 4px}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.btn{font:bold clamp(21px,2vw,29px) 'Times New Roman';border:3px solid #1966c5;border-radius:16px;background:#ffeb89;color:#193b80;padding:11px 20px;cursor:pointer;touch-action:manipulation}.btn:hover{background:#ffe05c}.btn:disabled{opacity:.45}.correct{color:#13803c;font-size:clamp(23px,2.3vw,33px);font-weight:bold;min-height:45px}.wrong{color:#ba3030}.solution{font-size:clamp(27px,2.6vw,37px);font-weight:bold;color:#163e91;line-height:1.5;background:#f0f9ff;border-radius:15px;padding:10px;margin-top:12px}.hide{display:none}.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stepbar span{padding:8px 14px;border-radius:12px;background:#e3ecfa;font-size:20px;font-weight:bold}.stepbar .active{background:#ffcf4b}.small{font-size:22px;color:#345}@media(max-width:850px){.layout{grid-template-columns:1fr}.flower img{height:180px}.panel{padding:12px}.story{font-size:26px}}@media(max-width:450px){.flower img{height:130px}.count{font-size:22px}.pill{font-size:20px}}</style></head><body><div class="wrap"><header>🌸 Жай есепті құрама есепке айналдыру 🌸</header><div class="nav"><span class="pill">3-кезең · Гүлзар</span></div><div class="layout"><section class="panel garden"><div class="flowers"><div class="flower"><img src="raushan.png" alt="Раушан"><div class="count" id="roseCount">Раушан — 17</div></div><div class="flower"><img src="kyzgaldak.png" alt="Қызғалдақ"><div class="count" id="tulipCount">Қызғалдақ — ?</div></div></div><div class="hint" id="gardenHint">Гүлзарда 31 гүл өсіп тұр</div><div class="brace"></div><div class="question" id="braceQuestion">31 гүл</div><p class="small" style="text-align:center"></p></section><section class="panel"><div class="stepbar" id="steps"></div><h2 class="tag" id="title"></h2><div class="story" id="story"></div><div id="quizArea"></div><div id="feedback" class="correct" aria-live="polite"></div><div id="solution" class="solution hide"></div><div class="buttons"><button id="next" class="btn hide" onclick="next()">Құрама есепке өту ➜</button><button class="btn" onclick="restart()">↻ Қайта бастау</button></div></section></div></div><script>
let phase=0,stage=0;
const $=id=>document.getElementById(id);
const cases=[
 {title:'1. Жай есеп',story:'Гүлзарда 31 гүл өсіп тұр. Оның 17-сі раушан, қалғандары қызғалдақ. Гүлзарда неше қызғалдақ өсіп тұр?',questions:[{label:'Қызғалдақ қанша?',opts:[15,13,14],ans:14}],calc:['31 − 17 = 14'],next:'Құрама есепке өту ➜'},
 {title:'2. Құрама есеп',story:'Гүлзарда 31 гүл өсіп тұр. Оның 17-сі раушан, қалғандары қызғалдақ. Қызғалдақ раушаннан нешеуі кем?',questions:[{label:'Қызғалдақ қанша?',opts:[15,13,14],ans:14},{label:'Қызғалдақ раушаннан нешеуі кем?',opts:[4,3,2],ans:3}],calc:['31 − 17 = 14','17 − 14 = 3'],next:'Келесі құрама есеп ➜'},
 {title:'3. Құрама есеп',story:'Гүлзарда 17 раушан гүлі өсіп тұр. Ал қызғалдақ одан 3-еуі кем. Гүлзарда барлығы неше гүл өсіп тұр?',questions:[{label:'Қызғалдақ қанша?',opts:[15,13,14],ans:14},{label:'Гүлзарда барлығы неше гүл өсіп тұр?',opts:[31,32,30],ans:31}],calc:['17 − 3 = 14','17 + 14 = 31'],next:'Қайта ойнау ↻'}
];
function render(){stage=0;let c=cases[phase];$('steps').innerHTML=cases.map((_,i)=>`<span class="${i===phase?'active':''}">${i+1}-есеп</span>`).join('');$('title').textContent=c.title;$('story').textContent=c.story;$('quizArea').innerHTML='';$('solution').classList.add('hide');$('next').classList.add('hide');$('next').textContent=c.next;$('braceQuestion').textContent='?';$('roseCount').textContent='Раушан — 17';$('tulipCount').textContent=phase===2?'Қызғалдақ — ?, 3-еуі кем':'Қызғалдақ — ?';$('gardenHint').textContent=phase===2?'Қызғалдақ раушаннан 3-еуі кем':'Гүлзарда 31 гүл өсіп тұр';showQuestion()}
function showQuestion(){let c=cases[phase],q=c.questions[stage];let area=$('quizArea');let wrap=document.createElement('div');wrap.className='quizStep';wrap.innerHTML=`<div class="questionLabel">${stage+1}-сұрақ. ${q.label}</div><div class="buttons"></div><div class="correct" aria-live="polite">Дұрыс жауапты таңда!</div>`;area.appendChild(wrap);let btns=wrap.querySelector('.buttons'),feedback=wrap.querySelector('.correct');q.opts.forEach(n=>{let b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>{if(wrap.dataset.done)return;if(n!==q.ans){feedback.textContent='Тағы ойланып көр!';feedback.className='correct wrong';return}wrap.dataset.done='yes';feedback.className='correct';feedback.textContent='✓ Дұрыс!';btns.querySelectorAll('button').forEach(x=>x.disabled=true);b.disabled=false;b.style.background='#b9f5b6';if(stage+1<c.questions.length){stage++;showQuestion()}else{let sol=$('solution');sol.innerHTML=c.calc.map((x,i)=>`${i+1}-амал: ${x}`).join('<br>');sol.classList.remove('hide');$('next').classList.remove('hide');feedback.textContent=c.questions.length===1?'🎉 Жарайсың! Дұрыс!':'🎉 Жарайсың! Екі сұраққа да дұрыс жауап бердің!'}};btns.appendChild(b)})}
function next(){if(phase===2){parent.postMessage({type:"gardenComplete"},"*");phase=0}else{phase++}render()}
function restart(){phase=0;render()}
render();
</script></body></html>
