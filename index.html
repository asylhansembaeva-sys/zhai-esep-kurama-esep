<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жай есепті құрама есепке айналдыру</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf8ff;font-family:'Times New Roman',serif;color:#142c60}header{background:linear-gradient(90deg,#f16b28,#ffc340);color:white;text-shadow:1px 2px #a34a16;text-align:center;font-size:clamp(25px,3.5vw,48px);font-weight:900;padding:14px}.tabs{display:flex;justify-content:center;gap:14px;margin:12px}.tabs button,.btn{background:#1454d7;color:white;border:0;border-radius:16px;padding:12px 20px;font: bold clamp(19px,2vw,28px) 'Times New Roman';cursor:pointer}.tabs button.active{background:#eb6425}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;padding:10px;max-width:1700px;margin:auto}.scene{position:relative;aspect-ratio:3/2;background:url(bg.jpg) center/100% 100%;border:5px solid #4eb6ff;border-radius:20px;overflow:hidden;touch-action:pan-y}.apple{position:absolute;width:10%;height:14%;object-fit:contain;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(0 3px 2px #6a3908)}.apple:active{cursor:grabbing}.basket-apple{position:absolute;width:9%;height:13%;object-fit:contain;cursor:pointer;filter:drop-shadow(0 2px 2px #713c16)}.panel{background:#fffdf0;border:4px solid #efc36c;border-radius:22px;padding:18px;box-shadow:0 3px 8px #0002}.panel h2{font-size:clamp(24px,2.3vw,35px);margin:0 0 12px;color:#bc421e}.panel p{font-size:clamp(21px,2vw,29px);line-height:1.25;font-weight:bold}.choices{display:flex;flex-wrap:wrap;gap:10px}.choices button{background:#fff1b7;border:3px solid #eb9c2c;border-radius:14px;padding:10px 20px;font: bold 30px 'Times New Roman';cursor:pointer;color:#173777}.choices button:hover{background:#d5f7cc}.feedback{color:#0b7d3c;font-size:28px;font-weight:bold;margin-top:10px}.equation{font-size:clamp(26px,2.7vw,40px);font-weight:bold;color:#d12c28;background:#fff1aa;border-radius:14px;text-align:center;margin-top:12px;padding:8px}.count{font-size:24px;font-weight:bold;text-align:center;color:#b32c1b}.music{background:linear-gradient(135deg,#bdeaff,#fff4c5);border:5px solid #44a4e9;border-radius:22px;min-height:450px;padding:20px;display:flex;align-items:center;justify-content:space-around;gap:12px}.instrument{text-align:center;flex:1;min-width:0}.instrument img{width:100%;height:290px;object-fit:contain;mix-blend-mode:multiply}.instrument strong{display:block;font-size:clamp(25px,3vw,43px);color:#b43b21}.hidden{display:none!important}.hint{font-size:20px;text-align:center;color:#335d85}.next{margin-top:14px;background:#12a15c}.wrong{color:#c32b28}.small{font-size:20px!important}.scheme{background:#fff;border:3px dashed #54a6df;border-radius:15px;padding:12px;margin-top:12px;text-align:center;font-size:clamp(22px,2vw,31px);font-weight:bold;color:#163b89}.scheme .line{border-bottom:4px solid #e05b3d;display:inline-block;min-width:130px;margin:4px 10px}.twoeq{font-size:clamp(24px,2.5vw,37px);line-height:1.6;background:#fff0a6;border:3px solid #efbb39;border-radius:15px;padding:8px;text-align:center;font-weight:bold;color:#a52a19;white-space:pre-line}.stepLabel{font-size:24px;font-weight:bold;color:#1248a0;margin:12px 0 7px}@media(max-width:900px){.layout{grid-template-columns:1fr}.music{min-height:280px}.instrument img{height:190px}.panel{padding:12px}}
.music{flex-wrap:wrap}.brace-music{flex:0 0 88%;position:relative;margin:0 6% 32px;height:42px;border-bottom:6px solid #174bb5;border-radius:0 0 45% 45%;text-align:center}.brace-music:before,.brace-music:after{content:"";position:absolute;bottom:-5px;width:22px;height:22px;border-bottom:6px solid #174bb5}.brace-music:before{left:0;border-left:6px solid #174bb5;border-radius:0 0 0 20px}.brace-music:after{right:0;border-right:6px solid #174bb5;border-radius:0 0 20px 0}.brace-music span{position:relative;top:20px;color:#c12e29;font-size:42px;font-weight:bold}.stage3frame{width:100%;height:calc(100vh - 155px);min-height:760px;border:0;border-radius:22px}.tabs{flex-wrap:wrap}.choices button{min-width:82px}@media(max-width:700px){.stage3frame{height:1050px}.music{padding:8px}.instrument img{height:165px}} 
/* 2026-11-16: responsive two-column stage layout */
#stage1,#stage2{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start;gap:20px;max-width:1800px;margin:auto;padding:16px}
#stage1.hidden,#stage2.hidden,#stage3.hidden{display:none!important}
#stage2>.panel{grid-column:2;grid-row:1;min-width:0}
#stage2>div:first-child{grid-column:1;grid-row:1;min-width:0}
#stage2 .music{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-around;gap:6px;min-height:390px;overflow:hidden}
#stage2 .instrument{flex:1 1 42%;min-width:0;text-align:center}
#stage2 .instrument img{width:100%;max-width:320px;height:245px;object-fit:contain}
#stage2 .brace-music{flex-basis:86%;margin:0 7% 25px;height:26px}
.panel{min-width:0}.panel h2{font-size:clamp(29px,3vw,45px)!important}.panel p{font-size:clamp(25px,2.4vw,38px)!important;line-height:1.3!important}
.stepLabel,.feedback,.equation,.twoeq{font-size:clamp(26px,2.4vw,38px)!important;line-height:1.32!important;font-weight:bold!important}
.choices{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}.choices button{font-size:clamp(28px,3vw,44px)!important;min-width:95px!important;min-height:70px!important;font-family:'Times New Roman',serif!important;font-weight:bold!important}
@media(max-width:760px){#stage1,#stage2{grid-template-columns:minmax(0,1fr);padding:8px;gap:12px}#stage2>.panel,#stage2>div:first-child{grid-column:1;grid-row:auto}#stage2 .music{min-height:240px}#stage2 .instrument img{height:165px}.panel p{font-size:26px!important}.stepLabel,.feedback,.equation{font-size:27px!important}}
</style></head><body><header>🍎 Жай есепті құрама есепке айналдыру 🎼</header><div class="tabs"><button id="tab1" class="active" onclick="switchStage(1)">1-кезең · Алма ағашы</button><button id="tab2" onclick="switchStage(2)">2-кезең · Аспаптар</button><button id="tab3" onclick="switchStage(3)">3-кезең · Гүлзар</button></div>
<div id="stage1" class="layout"><div><div class="scene" id="scene"><div id="tree"></div><div id="basket"></div></div><div class="count" id="count"></div><div class="hint">Алманы басыңыз немесе себетке сүйреңіз. Себеттегі алманы басып қайта алуға болады.</div></div><section class="panel"><h2 id="appleTitle">Жай есеп</h2><p id="appleText"></p><div id="applePrompt" class="stepLabel"></div><div id="appleWork" class="twoeq hidden"></div><div id="appleChoices" class="choices"></div><div id="appleFeedback" class="feedback"></div><div id="appleEq" class="equation hidden"></div><button id="appleNext" class="btn next hidden" onclick="appleAdvance()">Келесі қадам ➜</button><button class="btn" style="margin-top:12px;background:#7642ca" onclick="resetApple()">↻ Қайта бастау</button></section></div>
<div id="stage2" class="layout hidden"><div><div><div class="music" id="musicScene"><div class="instrument"><img src="dombyra.png" alt="Домбыра"><strong>23 домбыра</strong></div><div class="instrument"><img src="qobyz.png" alt="Қобыз"><strong id="qobyzLabel">? қобыз</strong><span id="lessLabel" style="font-size:26px;font-weight:bold;color:#c12e29">5-еуі кем</span></div><div class="brace-music" id="musicBrace"><span>?</span></div></div></div></div><section class="panel"><h2 id="musicTitle">Жай есеп</h2><p id="musicText"></p><div id="musicWork" class="twoeq hidden"></div><div id="musicPrompt" class="stepLabel"></div><div id="musicChoices" class="choices"></div><div id="musicFeedback" class="feedback"></div><div id="musicEq" class="equation hidden"></div><button id="musicNext" class="btn next hidden" onclick="musicAdvance()">Келесі қадам ➜</button><button class="btn" style="margin-top:12px;background:#7642ca" onclick="resetMusic()">↻ Қайта бастау</button></section></div>
<div id="stage3" class="hidden" style="max-width:1700px;margin:auto;padding:8px"><iframe class="stage3frame" src="garden.html" title="3-кезең Гүлзар" loading="eager"></iframe></div><script>
const positions=[[21,8],[37,8],[53,11],[11,23],[28,26],[44,27],[61,28],[8,43],[24,43],[40,45],[55,46],[29,60]];
const $=id=>document.getElementById(id);
let appleStep=0,treeCount=12,basketCount=0,appleAnswerStep=0,musicStep=0,musicAnswerStep=0;
function switchStage(n){$('stage1').classList.toggle('hidden',n!==1);$('stage2').classList.toggle('hidden',n!==2);$('stage3').classList.toggle('hidden',n!==3);$('tab3').classList.toggle('active',n===3);$('tab1').classList.toggle('active',n===1);$('tab2').classList.toggle('active',n===2)}
function renderApples(){let tree=$('tree'),basket=$('basket');tree.innerHTML='';basket.innerHTML='';positions.slice(0,treeCount).forEach((p,i)=>{let a=document.createElement('img');a.src='apple.png';a.className='apple';a.style.left=p[0]+'%';a.style.top=p[1]+'%';a.draggable=false;let down=null;a.addEventListener('pointerdown',e=>{if(appleAnswerStep>0)return;e.preventDefault();down=[e.clientX,e.clientY];a.setPointerCapture(e.pointerId)});a.addEventListener('pointerup',e=>{if(!down||appleAnswerStep>0)return;let r=$('scene').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if((x>.58&&y>.44&&y<.91)||Math.hypot(e.clientX-down[0],e.clientY-down[1])<22)moveApple(1);down=null});tree.appendChild(a)});for(let i=0;i<basketCount;i++){let a=document.createElement('img');a.src='apple.png';a.className='basket-apple';let col=i%4,row=Math.floor(i/4);a.style.left=(64+col*7.5+(row%2)*2)+'%';a.style.top=(59+row*6.3)+'%';a.title='Алманы ағашқа қайтару';a.onclick=()=>{if(appleAnswerStep===0)moveApple(-1)};basket.appendChild(a)}$('count').textContent=`Ағашта: ${treeCount} алма  |  Себетте: ${basketCount} алма`}
function moveApple(dir){let max=appleStep===0?7:12,min=appleStep===0?0:7;if(appleAnswerStep>0||basketCount+dir>max||basketCount+dir<min)return;treeCount-=dir;basketCount+=dir;renderApples();showApple()}
function choices(id,nums,correct,fn){$(id).innerHTML='';nums.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>fn(n,correct);$(id).appendChild(b)})}
const appleTasks=[
{title:'1-есеп · Жай есеп',text:'Ағашта 12 алма бар еді. Айжан 7 алманы теріп, себетке салды. Ағашта неше алма қалды?',answers:[5],options:[[4,5,6]],prompts:['Ағашта неше алма қалды?'],eq:['12 − 7 = 5'],target:7},
{title:'2-есеп · Құрама есеп',text:'Ағашта 12 алма бар еді. Айжан 7 алманы теріп, себетке салды. Ал қалған алмаларды Айша теріп, сол себетке салды. Екі қыз барлығы неше алма терді?',answers:[5,12],options:[[5,4,6],[11,13,12]],prompts:['Айша неше алма терді?','Екі қыз барлығы неше алма терді?'],eq:['1-амал: 12 − 7 = 5','2-амал: 7 + 5 = 12'],target:12},
{title:'3-есеп · Құрама есеп',text:'Ағашта 12 алма бар еді. Айжан 7 алманы теріп, себетке салды. Қалған алмаларды Айша терді. Айшаның терген алмасы Айжандікінен нешеуі кем?',answers:[5,2],options:[[6,4,5],[2,3,1]],prompts:['Айша неше алма терді?','Айшаның алмасы нешеуі кем?'],eq:['1-амал: 12 − 7 = 5','2-амал: 7 − 5 = 2'],target:12}
];
function showApple(){let t=appleTasks[appleStep],done=appleAnswerStep===t.answers.length;
$('appleTitle').textContent=t.title;$('appleText').textContent=t.text;$('appleWork').classList.add('hidden');$('appleEq').classList.add('hidden');$('appleNext').classList.add('hidden');$('appleChoices').innerHTML='';$('appleFeedback').classList.remove('wrong');
$('applePrompt').textContent=done?'':(appleAnswerStep+1)+'-сұрақ. '+t.prompts[appleAnswerStep];
if(done){$('appleFeedback').textContent=t.answers.length===2?'🎉 Жарайсың! Екі сұраққа да дұрыс жауап бердің!':'🎉 Жарайсың! Дұрыс жауап!';$('appleEq').textContent=t.eq.join('\n');$('appleEq').style.whiteSpace='pre-line';$('appleEq').classList.remove('hidden');$('appleNext').classList.remove('hidden');$('appleNext').textContent=appleStep===2?'2-кезеңге өту ➜':'Құрама есепке өту ➜';return}
$('appleFeedback').textContent=appleAnswerStep===1?'✅ Дұрыс! Енді 2-сұраққа жауап бер!':'Дұрыс жауапты таңдаңыз!';choices('appleChoices',t.options[appleAnswerStep],t.answers[appleAnswerStep],(n,correct)=>{if(n!==correct){$('appleFeedback').textContent='Қайта ойланып көр!';$('appleFeedback').classList.add('wrong');return}appleAnswerStep++;showApple()})}
function appleAdvance(){if(appleStep<2){appleStep++;appleAnswerStep=0;showApple()}else switchStage(2)}
function resetApple(){appleStep=0;treeCount=12;basketCount=0;appleAnswerStep=0;renderApples();showApple()}
const musicTasks=[{title:'1-есеп · Жай есеп',text:'Музыка кабинетінде 23 домбыра бар. Қобыз домбырадан 5-еуі кем. Музыка кабинетінде неше қобыз бар?',answers:[18],options:[[17,18,19]],eq:['23 − 5 = 18'],scheme:'Домбыра — 23  |  Қобыз — ?, 5-еуі кем'},{title:'2-есеп · Құрама есеп',text:'Музыка кабинетінде 23 домбыра бар. Қобыз домбырадан 5-еуі кем. Музыка кабинетінде барлығы неше музыкалық аспап бар?',answers:[18,41],options:[[18,17,19],[40,42,41]],eq:['23 − 5 = 18','23 + 18 = 41'],scheme:'Домбыра — 23  |  Қобыз — ?, 5-еуі кем  |  ⏟ ?'},{title:'3-есеп · Құрама есеп',text:'Музыка кабинетінде 18 қобыз бар. Ал домбыраның одан 5-еуі артық. Музыка кабинетінде барлығы неше аспап бар?',answers:[23,41],options:[[24,23,22],[42,40,41]],eq:['18 + 5 = 23','18 + 23 = 41'],scheme:''}];
function showMusic(){let t=musicTasks[musicStep],done=musicAnswerStep===t.answers.length;$('musicTitle').textContent=t.title;$('musicText').textContent=t.text;$('musicBrace').style.display=musicStep===0?'none':'block';$('qobyzLabel').textContent=musicStep===2?'18 қобыз':'Қобыз — ?';document.querySelector('.instrument:first-child strong').textContent=musicStep===2?'Домбыра — ?':'23 домбыра';$('lessLabel').textContent=musicStep===2?'Домбыра 5-еуі артық':'5-еуі кем';$('musicWork').classList.add('hidden'); $('musicEq').classList.add('hidden');$('musicNext').classList.toggle('hidden',!done);$('musicFeedback').classList.remove('wrong');$('musicChoices').innerHTML='';if(done){$('musicFeedback').textContent=t.answers.length===2?'🎉 Жарайсың! Екі сұраққа да дұрыс жауап бердің!':'🎉 Жарайсың! Дұрыс жауап!';$('musicEq').textContent=t.eq.map((v,i)=>(i+1)+'-амал: '+v).join('\n');$('musicEq').style.whiteSpace='pre-line';$('musicEq').classList.remove('hidden');$('qobyzLabel').textContent='18 қобыз';$('musicPrompt').textContent='';$('musicNext').textContent=musicStep===2?'3-кезеңге өту ➜':'Құрама есепке өту ➜';return}$('musicFeedback').textContent=musicAnswerStep===1?'✅ Дұрыс! Енді 2-сұраққа жауап бер!':'Дұрыс жауапты таңдаңыз!';$('musicPrompt').textContent=musicStep===0?'1-сұрақ. Қобыз нешеу?':musicAnswerStep===0?(musicStep===2?'1-сұрақ. Домбыра нешеу?':'1-сұрақ. Қобыз нешеу?'):'2-сұрақ. Барлығы неше аспап?';choices('musicChoices',t.options[musicAnswerStep],t.answers[musicAnswerStep],(n,correct)=>{if(n!==correct){$('musicFeedback').textContent='Қайта ойланып көр!';$('musicFeedback').classList.add('wrong');return}musicAnswerStep++;showMusic()})}
function musicAdvance(){if(musicStep===2){switchStage(3);return}musicStep++;musicAnswerStep=0;showMusic()}
function resetMusic(){musicStep=0;musicAnswerStep=0;showMusic()}
resetApple();resetMusic();
</script></body></html>
